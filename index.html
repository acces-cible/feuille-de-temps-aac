<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feuille de Temps</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1e3a5f; --blue-day:#dbeafe; --red-weekend:#fee2e2; }
  * { font-family:'Inter',sans-serif; box-sizing:border-box; }
  .mono { font-family:'DM Mono',monospace; }
  .nav-navy { background-color:var(--navy); }
  .bg-day   { background-color:var(--blue-day); }
  .bg-weekend { background-color:var(--red-weekend); }

  /* ── Desktop inputs */
  .time-input {
    font-family:'DM Mono',monospace; width:78px; text-align:center;
    border:1px solid #cbd5e1; border-radius:4px; padding:3px 4px; font-size:13px;
  }
  .time-input:focus { outline:2px solid #3b82f6; border-color:transparent; }

  /* ── Mobile cards */
  .mobile-day-card { background:white; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:12px; overflow:hidden; }
  .mobile-day-card.weekend { background:#fff5f5; border-left:4px solid #fca5a5; }
  .mobile-day-card.weekday { border-left:4px solid #93c5fd; }
  .mobile-time-input {
    font-family:'DM Mono',monospace; width:100%; text-align:center;
    border:1px solid #cbd5e1; border-radius:10px;
    padding:12px 6px; font-size:17px; background:#f8fafc;
  }
  .mobile-time-input:focus { outline:2px solid #3b82f6; border-color:transparent; background:white; }
  .mobile-notes-input {
    width:100%; border:1px solid #cbd5e1; border-radius:10px;
    padding:12px; font-size:16px; background:#f8fafc;
  }
  .mobile-notes-input:focus { outline:2px solid #3b82f6; border-color:transparent; background:white; }

  /* ── Shared */
  .highlight-search { background:#fef08a; border-radius:2px; }
  .progress-bar-inner { transition:width .5s ease; }
  .modal-backdrop { background:rgba(0,0,0,.55); backdrop-filter:blur(3px); }
  .slide-in { animation:slideIn .18s ease; }
  @keyframes slideIn { from{transform:translateY(-10px);opacity:0} to{transform:translateY(0);opacity:1} }
  .tab-active { border-bottom:3px solid #3b82f6; color:#1e40af; font-weight:600; }
  select, input[type=text], input[type=password], input[type=email], input[type=tel], textarea {
    border:1px solid #cbd5e1; border-radius:6px; padding:7px 10px; font-size:14px;
  }
  select:focus,input:focus,textarea:focus { outline:2px solid #3b82f6; border-color:transparent; }
  .btn { border-radius:6px; padding:6px 14px; font-size:13px; font-weight:500; cursor:pointer; transition:opacity .15s; border:none; display:inline-block; }
  .btn:hover { opacity:.85; }
  .btn-navy  { background:var(--navy); color:white; }
  .btn-green { background:#16a34a; color:white; }
  .btn-orange{ background:#ea580c; color:white; }
  .btn-red   { background:#dc2626; color:white; }
  .btn-gray  { background:#6b7280; color:white; }
  .btn-blue  { background:#2563eb; color:white; }
  .btn-light { background:#f1f5f9; color:#334155; border:1px solid #e2e8f0 !important; }
  .card { background:white; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .badge-approved { background:#dcfce7; color:#166534; padding:2px 8px; border-radius:12px; font-size:12px; font-weight:600; }
  .badge-pending  { background:#fff7ed; color:#9a3412; padding:2px 8px; border-radius:12px; font-size:12px; font-weight:600; }
  table { border-collapse:collapse; width:100%; }
  th,td { padding:5px 6px; }
  th { font-size:12px; font-weight:600; color:white; text-align:center; }
  td { font-size:13px; text-align:center; vertical-align:middle; }
  tbody tr { border-bottom:1px solid #e2e8f0; }
  .total-cell { font-family:'DM Mono',monospace; font-weight:600; font-size:13px; color:#1e3a5f; }
  .field-label { font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:.04em; font-weight:600; }

  /* ── Sticky total banner */
  .total-banner {
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:white; border-top:2px solid #e2e8f0;
    padding:12px 16px; box-shadow:0 -4px 16px rgba(0,0,0,.1);
  }
  @supports(padding-bottom:env(safe-area-inset-bottom)){
    .total-banner { padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
  }

  /* ── Responsive — mobile-only si écran tactile OU < 1280px */
  @media(max-width:1279px){ .desktop-only{display:none!important;} }
  @media(min-width:1280px){ .mobile-only{display:none!important;} }
  @media(hover:none) and (pointer:coarse){ .desktop-only{display:none!important;} .mobile-only{display:block!important;} }

  /* ── Toast notifications */
  #toast-container { position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast { display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:500;
    box-shadow:0 4px 16px rgba(0,0,0,.15); min-width:220px; max-width:340px; pointer-events:all;
    animation:toastIn .2s ease; }
  @keyframes toastIn { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }
  @keyframes toastOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(40px)} }
  .toast-success { background:#f0fdf4; border:1px solid #86efac; color:#166534; }
  .toast-error   { background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; }
  .toast-info    { background:#eff6ff; border:1px solid #93c5fd; color:#1e40af; }

  /* ── Sync spinner */
  .sync-spinner { width:14px; height:14px; border:2px solid #93c5fd; border-top-color:#2563eb; border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
  @keyframes spin { to{transform:rotate(360deg)} }
  #sync-indicator { position:fixed; bottom:70px; right:16px; z-index:30; background:white; border:1px solid #e2e8f0;
    border-radius:20px; padding:5px 12px; font-size:12px; color:#64748b; display:flex; align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08); transition:opacity .3s; gap:6px; }

  /* ── Debug panel */
  #debug-panel { position:fixed; bottom:0; left:0; right:0; z-index:9998; background:#1e293b; color:#94a3b8;
    font-family:monospace; font-size:11px; max-height:180px; overflow-y:auto; display:none; }
  #debug-panel.active { display:block; }
  #debug-panel .dp-line { padding:2px 8px; border-bottom:1px solid #334155; }
  #debug-panel .dp-line.err { color:#f87171; }
  #debug-panel .dp-line.ok  { color:#86efac; }
  #debug-panel .dp-toolbar { background:#0f172a; padding:4px 8px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; }

  /* ── Subtotal row */
  .subtotal-row td { background:#f1f5f9; font-weight:600; font-size:12px; color:#475569; border-top:2px solid #cbd5e1; }
</style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="app"></div>
<div id="toast-container"></div>
<div id="debug-panel">
  <div class="dp-toolbar">
    <span style="color:#e2e8f0;font-weight:bold">🐛 Debug Sync</span>
    <div style="display:flex;gap:8px">
      <button onclick="document.getElementById('debug-panel').classList.remove('active')" style="color:#94a3b8;background:none;border:none;cursor:pointer;font-size:11px">Fermer</button>
      <button onclick="document.getElementById('debug-log').innerHTML=''" style="color:#94a3b8;background:none;border:none;cursor:pointer;font-size:11px">Effacer</button>
    </div>
  </div>
  <div id="debug-log"></div>
</div>
<div id="sync-indicator" style="display:none"><div class="sync-spinner"></div><span>Sync…</span></div>
<script src="/js/core.js"></script>
<script src="/js/employee.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/archives.js"></script>
<script src="/js/modals.js"></script>
<script src="/js/airtable-sync.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
